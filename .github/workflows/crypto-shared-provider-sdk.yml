name: Crypto single shared GmSSL Provider / installed C11 SDK (qualification)

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/CryptoTLS*"
      - "cmake/crypto_tls.*"
      - "include/crypto/**"
      - "src/**"
      - "tests/sdk/**"
      - "tools/assemble_gmssl.cmake"
      - "providers/gmssl/hardening/**"
      - "providers/gmssl/patches/**"
      - "providers/gmssl/tests/fixtures/**"
      - ".github/workflows/crypto-shared-provider-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-native-provider:
    name: "${{ matrix.os }} shared TLS Provider + independent installed C11 consumer"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout exact Crypto candidate
        uses: actions/checkout@v4
      - name: Clone original pinned GmSSL source
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Check immutable source provenance and assemble private source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = \
            7c9f02904ef33e59c87b4f16621cc8fd434e7579
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/gmssl-provider-receipt.json" \
            -P tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/gmssl-provider-receipt.json"
      - name: Compile exact patched GmSSL implementation as private static PIC
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
          else
            generator=(-G Ninja)
          fi
          cmake -S _gmssl-upstream -B build-gmssl "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --config Release --target gmssl --parallel 2
      - name: Build exactly one shared Crypto TLS binary owner and install SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
            library="$GITHUB_WORKSPACE/build-gmssl/bin/Release/gmssl.lib"
          else
            generator=(-G Ninja)
            library="$GITHUB_WORKSPACE/build-gmssl/bin/libgmssl.a"
          fi
          test -s "$library"
          cmake -S . -B build-provider "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$library"
          cmake --build build-provider --config Release --parallel 2
          cmake --install build-provider --config Release \
            --prefix "$GITHUB_WORKSPACE/_installed"
          test -s "$GITHUB_WORKSPACE/_installed/include/crypto/tls.h"
          test -s "$GITHUB_WORKSPACE/_installed/lib/cmake/CryptoTLS/CryptoTLSTargets.cmake"
          if [[ "$RUNNER_OS" != Windows ]]; then
            test -s "$GITHUB_WORKSPACE/_installed/lib/libcrypto_tls.$(
              [[ "$RUNNER_OS" == macOS ]] && printf dylib || printf so)"
          else
            test -s "$GITHUB_WORKSPACE/_installed/bin/crypto_tls.dll"
          fi
      - name: Independently compile the installed SDK client (no GmSSL path)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
          else
            generator=(-G Ninja)
          fi
          cmake -S tests/sdk -B build-sdk "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/_installed" \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/providers/gmssl/tests/fixtures"
          cmake --build build-sdk --config Release --parallel 2
          test "$(ctest --test-dir build-sdk -C Release -N | sed -n 's/^Total Tests: //p')" = 2
          ctest --test-dir build-sdk -C Release --output-on-failure \
            --no-tests=error --timeout 90
      - name: Verify ELF public export surface excludes all GmSSL APIs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          nm -D --defined-only "$GITHUB_WORKSPACE/_installed/lib/libcrypto_tls.so" \
            | tee "$RUNNER_TEMP/crypto-provider-exported-symbols.txt"
          if grep -E ' (gmssl_|tls_|x509_|sm2_|sm3_|sm4_|rsa_)' \
                "$RUNNER_TEMP/crypto-provider-exported-symbols.txt"; then
            echo "Unreviewed GmSSL backend symbol exported by Crypto Provider" >&2
            exit 1
          fi
          test "$(grep -c ' crypto_tls_' "$RUNNER_TEMP/crypto-provider-exported-symbols.txt")" = 11
      - name: Upload Provider qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-shared-provider-${{ matrix.os }}-evidence
          path: |
            ${{ runner.temp }}/gmssl-provider-receipt.json
            ${{ runner.temp }}/crypto-provider-exported-symbols.txt
            build-provider/CMakeCache.txt
            build-sdk/Testing/Temporary/LastTest.log
          if-no-files-found: warn
