name: Crypto installed GmSSL from vcpkg-cache

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "include/**"
      - "vendor/**"
      - "tests/**"
      - "tools/**"
      - "vcpkg.json"
      - ".github/workflows/crypto-static-sdk.yml"
      - "providers/gmssl/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# qigao/vcpkg-cache is the ONLY GmSSL port/source/patch owner.
# The action and port identities are pinned; no upstream GmSSL checkout,
# no local source assembly or Crypto-owned provider source fallback.
jobs:
  installed-static-sdk:
    name: "Salts::Crypto vcpkg SDK / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: macos
          - os: windows-2025
            target: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@2e214ae44a3e3244eded5db6361194576356fc9e
        with:
          mode: read
      - name: Verify and install canonical GmSSL 3.2.0#13 vcpkg port
        shell: bash
        run: python3 tools/ci/install_vcpkg_gmssl.py ${{ matrix.target }}
      - name: Build, test and install single Salts::Crypto archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
          else
            gen=(-G Ninja)
          fi
          cmake -S . -B build-crypto "${gen[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON "-DCRYPTO_GMSSL_ROOT=$CRYPTO_GMSSL_ROOT"
          cmake --build build-crypto --config Release --parallel 2
          ctest --test-dir build-crypto -C Release --no-tests=error --output-on-failure
          cmake --install build-crypto --config Release --prefix "$RUNNER_TEMP/crypto-static"
          python3 tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/crypto-static" --report build-crypto/static.json
      - name: Independent installed C11/C++17, real TLS1.2/1.3, CipherBIO
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
            peer=()
          else
            gen=(-G Ninja)
            peer=(-DCRYPTO_SDK_ENABLE_OPENSSL_PEER=ON
                  -DCRYPTO_SDK_ENABLE_INDEPENDENT_EXPORTER=ON)
            if [[ "$RUNNER_OS" == macOS ]]; then
              root="$(brew --prefix openssl@3)"
              peer+=("-DOPENSSL_ROOT_DIR=$root")
              export PATH="$root/bin:$PATH"
            fi
          fi
          cmake -S tests/owner -B build-owner "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-static"
          cmake --build build-owner --config Release --parallel 2
          ctest --test-dir build-owner -C Release --no-tests=error --output-on-failure
          cmake -S tests/sdk -B build-sdk "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-static" \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO=ON "${peer[@]}" \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/tests/fixtures"
          cmake --build build-sdk --config Release --parallel 2
          ctest --test-dir build-sdk -C Release --no-tests=error --output-on-failure
      - name: Independent OpenSSL3 CA/SAN/HRR/exporter acceptance and negatives
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          fi
          openssl version | grep -q '^OpenSSL 3[.]'
          bash tools/qualify_crypto_shared_openssl.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_client" "$RUNNER_TEMP/static-peer" 9740
          bash tools/qualify_crypto_exporter_openssl.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_client" "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_exporter_oracle" "$RUNNER_TEMP/static-peer" 9830
          bash tools/qualify_crypto_server_openssl.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" "$RUNNER_TEMP/static-peer" 9900
          bash tools/qualify_crypto_server_api_openssl.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_api_peer_client" "$RUNNER_TEMP/static-peer" 9950
          CRYPTO_TLS_TEST_HRR_ONLY=1 bash tools/qualify_crypto_server_openssl.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" "$RUNNER_TEMP/static-peer" 9920
          bash tools/qualify_crypto_hrr_ccs_negative.sh "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_api_peer_client" "$RUNNER_TEMP/static-peer" 9970
      - name: Relocated installed SDK, independent consumer and symbol audit
        shell: bash
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/crypto-static" "$RUNNER_TEMP/crypto-relocated"
          cmake -S tests/owner -B build-owner-relocated \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-relocated" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-owner-relocated --config Release --parallel 2
          ctest --test-dir build-owner-relocated -C Release \
            --no-tests=error --output-on-failure
          python3 tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/crypto-relocated" --report build-crypto/relocated.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-vcpkg-static-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build-crypto/static.json
            build-crypto/relocated.json
            build-crypto/Testing/Temporary/LastTest.log
            build-sdk/Testing/Temporary/LastTest.log
            build-owner/Testing/Temporary/LastTest.log

  facade-sanitizers:
    name: "Static Crypto facade ${{ matrix.mode }} (installed GmSSL)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [asan-ubsan-lsan, tsan]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=23
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@2e214ae44a3e3244eded5db6361194576356fc9e
        with:
          mode: read
      - name: Verify and install GmSSL exclusively from vcpkg-cache
        shell: bash
        run: python3 tools/ci/install_vcpkg_gmssl.py linux-x64
      - name: Instrument Crypto sources and independent installed consumer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.mode }}" == tsan ]]; then
            flags="-O1 -g -fno-omit-frame-pointer -fsanitize=thread"
          else
            flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          fi
          # This instruments Crypto+libecc, not the prebuilt GmSSL vcpkg
          # archive. Do not claim a fully source-instrumented GmSSL gate.
          cmake -S . -B build-crypto -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            "-DCRYPTO_GMSSL_ROOT=$CRYPTO_GMSSL_ROOT"
          cmake --build build-crypto --parallel 2
          ctest --test-dir build-crypto --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3
          cmake --install build-crypto --prefix "$RUNNER_TEMP/crypto-sanitized"
          python3 tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/crypto-sanitized" --report build-crypto/static.json
          cmake -S tests/sdk -B build-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-sanitized" \
            -DCRYPTO_SDK_ENABLE_CONCURRENT_LIFECYCLE=ON \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO=ON \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO_RACE=ON \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/tests/fixtures"
          cmake --build build-sdk --parallel 2
          ctest --test-dir build-sdk --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-vcpkg-facade-${{ matrix.mode }}
          if-no-files-found: warn
          path: |
            build-crypto/static.json
            build-crypto/Testing/Temporary/LastTest.log
            build-sdk/Testing/Temporary/LastTest.log

  mobile-installed-static-sdk:
    name: "Salts::Crypto vcpkg SDK / ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64
            os: ubuntu-24.04
          - target: ios-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@2e214ae44a3e3244eded5db6361194576356fc9e
        with:
          mode: read
      - name: Verify and install exact GmSSL vcpkg target SDK
        shell: bash
        run: python3 tools/ci/install_vcpkg_gmssl.py ${{ matrix.target }}
      - name: Cross build and audit sole Crypto installed static archive
        shell: bash
        run: |
          set -euo pipefail
          cross=()
          exe_link=OFF
          if [[ "${{ matrix.target }}" == android-arm64 ]]; then
            : "${ANDROID_NDK_HOME:?Android NDK required}"
            cross+=("-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
                    "-DANDROID_ABI=arm64-v8a" "-DANDROID_PLATFORM=android-26")
            exe_link=ON
          else
            cross+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
                    -DCMAKE_OSX_ARCHITECTURES=arm64
                    -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY)
          fi
          common=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON)
          cmake -S . -B build-crypto -G Ninja "${cross[@]}" "${common[@]}" \
            -DBUILD_TESTING=OFF "-DCRYPTO_GMSSL_ROOT=$CRYPTO_GMSSL_ROOT"
          cmake --build build-crypto --config Release --parallel 2
          prefix="$RUNNER_TEMP/crypto-mobile-installed"
          cmake --install build-crypto --config Release --prefix "$prefix"
          test -s "$prefix/lib/libsalts_crypto.a"
          test -s "$prefix/lib/cmake/Crypto/CryptoConfig.cmake"
          if [[ "${{ matrix.target }}" == android-arm64 ]]; then
            llvm_nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
            test -x "$llvm_nm"
            mkdir -p "$RUNNER_TEMP/crypto-audit-bin"
            ln -s "$llvm_nm" "$RUNNER_TEMP/crypto-audit-bin/nm"
            export PATH="$RUNNER_TEMP/crypto-audit-bin:$PATH"
          fi
          python3 tools/audit_static_crypto.py \
            --prefix "$prefix" --report build-crypto/mobile-static.json
          cmake -S tests/mobile -B build-mobile -G Ninja "${cross[@]}" \
            "${common[@]}" "-DCRYPTO_SDK_ROOT=$prefix" \
            "-DCRYPTO_MOBILE_EXE_LINK_TESTS=$exe_link"
          cmake --build build-mobile --config Release --parallel 2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-vcpkg-mobile-${{ matrix.target }}
          if-no-files-found: warn
          path: build-crypto/mobile-static.json
