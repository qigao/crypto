name: GmSSL 3.2 native ASan UBSan LSan qualification

on:
  pull_request:
    paths:
      - ".github/workflows/gmssl-native-sanitizers.yml"
      - "cmake/qualification/**"
      - "tools/assemble_gmssl.cmake"
      - "tools/run_gmssl_openssl_interop.py"
      - "providers/gmssl/patches/**"
      - "providers/gmssl/src/**"
      - "providers/gmssl/include/**"
      - "providers/gmssl/hardening/**"
      - "providers/gmssl/tests/**"
      - "providers/gmssl/provenance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sanitizers:
    name: Linux real patched backend and original TLS contracts (ASan/UBSan/LSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Instrument source and consumers together. Never hide a detected leak
      # or turn a sanitizer finding into a test skip/xfail.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23
    steps:
      - name: Crypto exact candidate source
        uses: actions/checkout@v4
      - name: Pinned upstream GmSSL exact SHA
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Original source identity and clean deterministic assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = \
            7c9f02904ef33e59c87b4f16621cc8fd434e7579
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/gmssl-sanitized-source-receipt.json" \
            -P tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/gmssl-sanitized-source-receipt.json"
      - name: Build real GmSSL backend and CLI with Address and UndefinedBehavior Sanitizer
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S _gmssl-upstream -B build-gmssl-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON \
            -DENABLE_SECP256R1=ON -DENABLE_SHA2=ON -DENABLE_AES=ON \
            -DENABLE_AES_CCM=OFF -DENABLE_SHA1=ON \
            -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl-asan --target gmssl gmssl-bin --parallel 2
          test -s build-gmssl-asan/bin/libgmssl.a
          test -x build-gmssl-asan/bin/gmssl
      - name: Compile and execute all 29 unchanged native C11 contracts under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S cmake/qualification -B build-qualify-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DGMSSL_ASSEMBLED_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLED_LIBRARY=$GITHUB_WORKSPACE/build-gmssl-asan/bin/libgmssl.a"
          cmake --build build-qualify-asan --parallel 2
          test "$(ctest --test-dir build-qualify-asan -N | sed -n 's/^Total Tests: //p')" = 29
          ctest --test-dir build-qualify-asan --output-on-failure \
            --no-tests=error --timeout 120 --parallel 1
      - name: Exercise original OpenSSL 3 native peers under sanitizer instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_gmssl_openssl_interop.py \
            --gmssl "$GITHUB_WORKSPACE/build-gmssl-asan/bin/gmssl" \
            --scratch-dir "$RUNNER_TEMP/gmssl-asan-interop-scratch" \
            --evidence-dir "$RUNNER_TEMP/gmssl-asan-openssl-interop" \
            --timeout 180
      - name: Preserve sanitizer source, contract and peer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmssl-native-asan-ubsan-lsan-evidence
          path: |
            ${{ runner.temp }}/gmssl-sanitized-source-receipt.json
            ${{ runner.temp }}/gmssl-asan-openssl-interop/**
            build-gmssl-asan/CMakeCache.txt
            build-qualify-asan/CMakeCache.txt
            build-qualify-asan/Testing/Temporary/LastTest.log
          if-no-files-found: warn
