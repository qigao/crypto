name: GmSSL 3.2 standalone source assembly (qualification only)

on:
  pull_request:
    paths:
      - "tools/assemble_gmssl.cmake"
      - "tools/run_gmssl_openssl_interop.py"
      - "cmake/qualification/**"
      - ".github/workflows/gmssl-source-assembly.yml"
      - "providers/gmssl/patches/**"
      - "providers/gmssl/tests/**"
      - "providers/gmssl/provenance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-three-platform:
    name: ${{ matrix.os }} patched GmSSL C11 and real provider contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Crypto exact candidate sources
        uses: actions/checkout@v4
      - name: Original upstream GmSSL exact git revision
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Qualify original 92-source and 40-patch manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = \
            7c9f02904ef33e59c87b4f16621cc8fd434e7579
      - name: Replay source transformations without a vcpkg port
        shell: bash
        run: |
          set -euo pipefail
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/gmssl-assembly-receipt.json" \
            -P tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/gmssl-assembly-receipt.json"
          git -C _gmssl-upstream diff --stat
      - name: Compile the patched real private GmSSL 3.2 C11 static implementation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
          else
            generator=(-G Ninja)
          fi
          cmake -S _gmssl-upstream -B build-gmssl "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --config Release --target gmssl --parallel 2
          if [[ "$RUNNER_OS" == Windows ]]; then
            test -s build-gmssl/bin/Release/gmssl.lib
          else
            test -s build-gmssl/bin/libgmssl.a
          fi
      - name: Compile and run 29 unchanged original GmSSL TLS and X509 contracts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            generator=(-G 'Visual Studio 18 2026' -A x64)
            library="$GITHUB_WORKSPACE/build-gmssl/bin/Release/gmssl.lib"
          else
            generator=(-G Ninja)
            library="$GITHUB_WORKSPACE/build-gmssl/bin/libgmssl.a"
          fi
          cmake -S cmake/qualification -B build-qualify "${generator[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DGMSSL_ASSEMBLED_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLED_LIBRARY=$library"
          cmake --build build-qualify --config Release --parallel 2
          # 5 original accepted + 22 additional original crypto/TLS contracts
          # + two full TLS 1.2/1.3 in-memory handshake/external-I/O tests.
          test "$(ctest --test-dir build-qualify -C Release -N | sed -n 's/^Total Tests: //p')" = 29
          ctest --test-dir build-qualify -C Release --output-on-failure \
            --no-tests=error --timeout 120
      - name: Verify independent OpenSSL 3 TLS peers (native Linux/macOS only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The CLI is test-only and links the single local patched library.
          # No installation or public GmSSL package is exported.
          cmake --build build-gmssl --config Release --target gmssl-bin --parallel 2
          gmssl_bin="$GITHUB_WORKSPACE/build-gmssl/bin/gmssl"
          test -x "$gmssl_bin"
          if [[ "$RUNNER_OS" == macOS ]]; then
            openssl_prefix="$(brew --prefix openssl@3)"
            test -x "$openssl_prefix/bin/openssl"
            export PATH="$openssl_prefix/bin:$PATH"
          fi
          # Original frozen scripts exercise independent network peers:
          # TLS 1.2 mutual RSA auth in both directions; TLS 1.2/1.3
          # P-384 issuer/P-256 leaf, and wrong-CA/wrong-SAN rejection.
          python3 tools/run_gmssl_openssl_interop.py \
            --gmssl "$gmssl_bin" \
            --scratch-dir "$RUNNER_TEMP/gmssl-interop-scratch" \
            --evidence-dir "$RUNNER_TEMP/gmssl-openssl-interop" \
            --timeout 180
      - name: Upload assembled source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmssl-assembled-source-${{ matrix.os }}-evidence
          path: |
            ${{ runner.temp }}/gmssl-assembly-receipt.json
            build-gmssl/CMakeCache.txt
            build-qualify/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/gmssl-openssl-interop/**
          if-no-files-found: warn
