name: Crypto shared Provider ASan UBSan LSan installed facade (qualification)

on:
  pull_request:
    paths:
      - ".github/workflows/crypto-shared-provider-asan-ubsan.yml"
      - "CMakeLists.txt"
      - "include/crypto/**"
      - "src/**"
      - "tests/sdk/**"
      - "tests/owner/**"
      - "tools/qualify_crypto_shared_openssl.sh"
      - "tools/qualify_crypto_exporter_openssl.sh"
      - "tools/qualify_crypto_hrr_ccs_negative.sh"
      - "tools/tls13_hrr_ccs_mutation_proxy.py"
      - "tools/assemble_gmssl.cmake"
      - "providers/gmssl/hardening/**"
      - "providers/gmssl/patches/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-facade-sanitizers:
    name: Linux source-instrumented shared DSO + installed SDK + independent TLS peers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=23
    steps:
      - name: Crypto exact candidate sources
        uses: actions/checkout@v4
      - name: Checkout exact original GmSSL 3.2 SHA
        uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Verify and replay original source then separate Crypto safety fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          test "$(git -C _gmssl-upstream rev-parse HEAD)" = \
            7c9f02904ef33e59c87b4f16621cc8fd434e7579
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/crypto-shared-asan-source.json" \
            -P tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/crypto-shared-asan-source.json"
      - name: Build instrumented original GmSSL static library
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S _gmssl-upstream -B build-gmssl-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$flags" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl-asan --target gmssl --parallel 2
          test -s build-gmssl-asan/bin/libgmssl.a
      - name: Build shared opaque C11 adapter with same native sanitizer instrumentation
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S . -B build-provider-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl-asan/bin/libgmssl.a"
          cmake --build build-provider-asan --parallel 2
          cmake --install build-provider-asan \
            --prefix "$GITHUB_WORKSPACE/_installed-asan"
          test -s "$GITHUB_WORKSPACE/_installed-asan/lib/libcrypto_tls.so"
      - name: Instrument independent installed C11 consumer (no raw GmSSL)
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S tests/sdk -B build-sdk-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/_installed-asan" \
            -DCRYPTO_SDK_ENABLE_OPENSSL_PEER=ON \
            -DCRYPTO_SDK_ENABLE_INDEPENDENT_EXPORTER=ON \
            -DCRYPTO_SDK_ENABLE_HOST_LEASE=ON \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/providers/gmssl/tests/fixtures"
          cmake --build build-sdk-asan --parallel 2
          test "$(ctest --test-dir build-sdk-asan -N |
            sed -n 's/^Total Tests: //p')" = 3
      - name: Repeat native TLS 1.2/1.3 facade and standalone DSO unload tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-sdk-asan \
            --output-on-failure --no-tests=error --timeout 120 \
            --repeat until-fail:3
      - name: Instrumented facade vs independent OpenSSL 3 true peers and trust
        shell: bash
        run: |
          set -euo pipefail
          openssl version | grep -q '^OpenSSL 3[.]'
          bash tools/qualify_crypto_shared_openssl.sh \
            "$GITHUB_WORKSPACE/build-sdk-asan/crypto_sdk_openssl_client" \
            "$RUNNER_TEMP/crypto-shared-asan-peer" 9780
          bash tools/qualify_crypto_exporter_openssl.sh \
            "$GITHUB_WORKSPACE/build-sdk-asan/crypto_sdk_openssl_client" \
            "$GITHUB_WORKSPACE/build-sdk-asan/crypto_sdk_openssl_exporter_oracle" \
            "$RUNNER_TEMP/crypto-shared-asan-peer" 9860
          # Force real HRR, mutate its single compatibility CCS on the wire.
          # Under native source-instrumented ASan/UBSan/LSan, neither invalid
          # nor duplicated CCS may reach an authenticated session/exporter.
          bash tools/qualify_crypto_hrr_ccs_negative.sh \
            "$GITHUB_WORKSPACE/build-sdk-asan/crypto_sdk_openssl_server" \
            "$GITHUB_WORKSPACE/build-sdk-asan/crypto_sdk_openssl_api_peer_client" \
            "$RUNNER_TEMP/crypto-shared-asan-peer" 9980
      - name: ASan UBSan LSan exact SM3 KAT, shared TLS view and two imported MODULEs
        shell: bash
        run: |
          set -euo pipefail
          flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          cmake -S tests/owner -B build-owner-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/_installed-asan"
          cmake --build build-owner-asan --parallel 2
          test "$(ctest --test-dir build-owner-asan -N | sed -n 's/^Total Tests: //p')" = 3
          ctest --test-dir build-owner-asan --no-tests=error \
            --output-on-failure --timeout 120 --repeat until-fail:3
      - name: Preserve sanitizer source, shared library and peer evidence (no private keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-shared-provider-native-asan-ubsan-lsan
          path: |
            ${{ runner.temp }}/crypto-shared-asan-source.json
            ${{ runner.temp }}/crypto-shared-asan-peer/*.out
            ${{ runner.temp }}/crypto-shared-asan-peer/*.err
            ${{ runner.temp }}/crypto-shared-asan-peer/*.log
            build-gmssl-asan/CMakeCache.txt
            build-provider-asan/CMakeCache.txt
            build-sdk-asan/Testing/Temporary/LastTest.log
            build-owner-asan/Testing/Temporary/LastTest.log
          if-no-files-found: warn
