name: GmSSL 3.2.0 provider source import provenance

# Verify exact Git-blob fidelity on the independent Crypto repository.
# Not a provider build nor a claim of qualified TLS/X509 API.
on:
  pull_request:
    paths:
      - "providers/gmssl/**"
      - "tools/verify_gmssl_import.py"
      - "tests/gmssl-import/**"
      - ".github/workflows/gmssl-source-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gmssl-immutable-import:
    name: ${{ matrix.os }} exact source + archive identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact 92 provider source Git blobs and 40 ordered source patches
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/gmssl-import -p 'test_*.py' -v
          python tools/verify_gmssl_import.py
      - name: Rebuild the original vcpkg-cache Crypto handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _gmssl-provenance
          python tools/verify_gmssl_import.py \
            --archive _gmssl-provenance/gmssl-provider-handoff.tar.gz \
            --report _gmssl-provenance/import-receipt.json
          python tools/verify_gmssl_import.py \
            --archive _gmssl-provenance/repeated.tar.gz
          cmp _gmssl-provenance/gmssl-provider-handoff.tar.gz \
              _gmssl-provenance/repeated.tar.gz
          tar -tzf _gmssl-provenance/gmssl-provider-handoff.tar.gz \
            > _gmssl-provenance/file-index.txt
          test "$(wc -l < _gmssl-provenance/file-index.txt)" -eq 95
          grep -Fxq 'providers/gmssl/patches/backports/secp384r1_verify.c' \
            _gmssl-provenance/file-index.txt
          grep -Fxq 'providers/gmssl/tests/fixtures/p384-ca-sha384.pem' \
            _gmssl-provenance/file-index.txt
          if grep -Eq '(^|/)(vcpkg[.]json|portfile[.]cmake|GmSSLConfig[.]cmake)$' \
              _gmssl-provenance/file-index.txt; then
            echo "FAIL: vcpkg packaging file leaked into Crypto import kit" >&2
            exit 1
          fi
          rm _gmssl-provenance/repeated.tar.gz
      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmssl-source-provenance-${{ matrix.os }}
          path: |
            _gmssl-provenance/gmssl-provider-handoff.tar.gz
            _gmssl-provenance/import-receipt.json
            _gmssl-provenance/file-index.txt
          if-no-files-found: warn
