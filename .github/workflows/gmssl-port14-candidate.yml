name: Crypto GmSSL staged RFC8446 CCS HRR parity
on:
  pull_request:
    paths:
      - "providers/gmssl/candidates/port14/**"
      - "providers/gmssl/hardening/**"
      - "tools/assemble_gmssl.cmake"
      - "tests/gmssl-port14/**"
      - "tools/audit_gmssl_port14_candidate.py"
      - ".github/workflows/gmssl-port14-candidate.yml"
      - "docs/GMSSL-OWNERSHIP.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-parser:
    name: "Pinned candidate parser / ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check 92 original Crypto-owned blobs and 7 exact port14 candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          python3 tools/audit_gmssl_port14_candidate.py
          python3 -m py_compile providers/gmssl/candidates/port14/tests/tls13-dummy-ccs-interop.py
      - name: Build C11 candidate parser without GmSSL SDK, CNet or compatibility runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
          else
            gen=(-G Ninja)
          fi
          cmake -S tests/gmssl-port14 -B build-port14 "${gen[@]}" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-port14 --config Release --parallel 2
          ctest --test-dir build-port14 -C Release --no-tests=error \
            --output-on-failure --repeat until-fail:3


  candidate-static-native:
    name: "Opt-in GmSSL CCS/HRR static SDK / ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Assemble source-only candidate from exactly pinned GmSSL
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          python3 tools/audit_gmssl_port14_candidate.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            -DGMSSL_PORT14_CRYPTO_CANDIDATE=ON \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/gmssl-candidate-source.json" \
            -P tools/assemble_gmssl.cmake
          test -s "$RUNNER_TEMP/gmssl-candidate-source.json"
          grep -q crypto_hrr_ccs_seen _gmssl-upstream/include/gmssl/tls.h
          ! grep -q handshake_compat_ccs_count _gmssl-upstream/include/gmssl/tls.h
          test -s _gmssl-upstream/src/tls13-compat-ccs.h
      - name: Build one static native owner and test migrated SHA256, Ed448, TLS
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
            lib="$GITHUB_WORKSPACE/build-gmssl/bin/Release/gmssl.lib"
          else
            gen=(-G Ninja)
            lib="$GITHUB_WORKSPACE/build-gmssl/bin/libgmssl.a"
          fi
          cmake -S _gmssl-upstream -B build-gmssl "${gen[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_TLS=ON -DENABLE_SECP256R1=ON \
            -DENABLE_SECP384R1=ON -DENABLE_SHA2=ON -DENABLE_AES=ON \
            -DENABLE_AES_CCM=OFF -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF \
            -DENABLE_GHASH=OFF -DENABLE_SM9=OFF -DENABLE_CMS=OFF \
            -DENABLE_LMS=OFF -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF \
            -DENABLE_KYBER=OFF -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --config Release --target gmssl --parallel 2
          test -s "$lib"
          cmake -S . -B build-crypto "${gen[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$lib"
          cmake --build build-crypto --config Release --parallel 2
          ctest --test-dir build-crypto -C Release --no-tests=error \
            --output-on-failure --timeout 120
          cmake --install build-crypto --config Release \
            --prefix "$RUNNER_TEMP/candidate-static"
          python3 tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/candidate-static" \
            --report build-crypto/candidate-archive.json
      - name: Installed C11 and C++17 opaque TLS consumers
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            gen=(-G 'Visual Studio 18 2026' -A x64)
            peer=()
          else
            gen=(-G Ninja)
            peer=(-DCRYPTO_SDK_ENABLE_OPENSSL_PEER=ON \
                  -DCRYPTO_SDK_ENABLE_INDEPENDENT_EXPORTER=ON)
            if [[ "$RUNNER_OS" == macOS ]]; then
              root="$(brew --prefix openssl@3)"
              peer+=("-DOPENSSL_ROOT_DIR=$root")
              export PATH="$root/bin:$PATH"
            fi
          fi
          cmake -S tests/owner -B build-owner "${gen[@]}" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/candidate-static"
          cmake --build build-owner --config Release --parallel 2
          ctest --test-dir build-owner -C Release --no-tests=error --output-on-failure
          cmake -S tests/sdk -B build-sdk "${gen[@]}" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/candidate-static" \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/providers/gmssl/tests/fixtures" \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO=ON "${peer[@]}"
          cmake --build build-sdk --config Release --parallel 2
          ctest --test-dir build-sdk -C Release --no-tests=error --output-on-failure
      - name: Independent OpenSSL3 HRR/CCS, direct P256 and strict denial
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          fi
          bash tools/qualify_crypto_shared_openssl.sh \
            "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_client" \
            "$RUNNER_TEMP/crypto-port14-peer" 9740
          bash tools/qualify_crypto_server_openssl.sh \
            "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" \
            "$RUNNER_TEMP/crypto-port14-peer" 9900
          CRYPTO_TLS_TEST_HRR_ONLY=1 bash tools/qualify_crypto_server_openssl.sh \
            "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" \
            "$RUNNER_TEMP/crypto-port14-peer" 9920
          bash tools/qualify_crypto_hrr_ccs_negative.sh \
            "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_server" \
            "$GITHUB_WORKSPACE/build-sdk/crypto_sdk_openssl_api_peer_client" \
            "$RUNNER_TEMP/crypto-port14-peer" 9970
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-port14-static-${{ matrix.os }}
          path: |
            build-crypto/candidate-archive.json
            build-crypto/Testing/Temporary/LastTest.log
            build-sdk/Testing/Temporary/LastTest.log
            build-owner/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/gmssl-candidate-source.json
          if-no-files-found: warn

  candidate-source-sanitizers:
    name: "Opt-in GmSSL CCS/HRR source ${{ matrix.mode }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [asan-ubsan-lsan, tsan]
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: exitcode=23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: guanzhi/GmSSL
          ref: 7c9f02904ef33e59c87b4f16621cc8fd434e7579
          path: _gmssl-upstream
          persist-credentials: false
      - name: Assemble source and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_gmssl_import.py
          python3 tools/audit_gmssl_port14_candidate.py
          cmake "-DGMSSL_UPSTREAM_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            -DGMSSL_PORT14_CRYPTO_CANDIDATE=ON \
            "-DGMSSL_ASSEMBLY_RECEIPT=$RUNNER_TEMP/candidate-source-sanitized.json" \
            -P tools/assemble_gmssl.cmake
      - name: Fully instrument provider, archive, and installed C11 consumer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.mode }}" == tsan ]]; then
            flags="-O1 -g -fno-omit-frame-pointer -fsanitize=thread"
          else
            flags="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          fi
          cmake -S _gmssl-upstream -B build-gmssl -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS=$flags" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_TLS=ON -DENABLE_SECP256R1=ON -DENABLE_SECP384R1=ON \
            -DENABLE_SHA2=ON -DENABLE_AES=ON -DENABLE_AES_CCM=OFF \
            -DENABLE_SHA1=ON -DENABLE_CHACHA20=OFF -DENABLE_GHASH=OFF \
            -DENABLE_SM9=OFF -DENABLE_CMS=OFF -DENABLE_LMS=OFF \
            -DENABLE_XMSS=OFF -DENABLE_SPHINCS=OFF -DENABLE_KYBER=OFF \
            -DENABLE_ZUC=OFF -DENABLE_SKF=OFF -DENABLE_SDF=OFF
          cmake --build build-gmssl --target gmssl --parallel 2
          cmake -S . -B build-crypto -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            "-DCRYPTO_GMSSL_SOURCE=$GITHUB_WORKSPACE/_gmssl-upstream" \
            "-DCRYPTO_GMSSL_STATIC=$GITHUB_WORKSPACE/build-gmssl/bin/libgmssl.a"
          cmake --build build-crypto --parallel 2
          ctest --test-dir build-crypto --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3
          cmake --install build-crypto --prefix "$RUNNER_TEMP/crypto-sanitized"
          python3 tools/audit_static_crypto.py \
            --prefix "$RUNNER_TEMP/crypto-sanitized" --report build-crypto/candidate-source-static.json
          cmake -S tests/sdk -B build-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=$flags" \
            "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/crypto-sanitized" \
            -DCRYPTO_SDK_ENABLE_CONCURRENT_LIFECYCLE=ON \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO=ON \
            -DCRYPTO_SDK_ENABLE_CIPHER_BIO_RACE=ON \
            "-DCRYPTO_TEST_FIXTURES=$GITHUB_WORKSPACE/providers/gmssl/tests/fixtures"
          cmake --build build-sdk --parallel 2
          ctest --test-dir build-sdk --no-tests=error --output-on-failure \
            --timeout 120 --repeat until-fail:3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-port14-source-${{ matrix.mode }}
          path: |
            build-crypto/candidate-source-static.json
            build-crypto/Testing/Temporary/LastTest.log
            build-sdk/Testing/Temporary/LastTest.log
          if-no-files-found: warn
